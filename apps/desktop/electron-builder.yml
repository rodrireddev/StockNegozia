appId: com.stocknegozia.desktop
productName: StockNegozia
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
icon: ../../assets/branding/generated/windows/icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../../assets/branding/generated/windows/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
