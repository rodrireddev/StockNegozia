appId: com.stocknegozia.desktop
productName: StockNegozia
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# La app empaquetada busca todo esto relativo a `process.resourcesPath` (ver `repoRoot` en
# electron/main/index.ts): el backend que lanza `backend-manager.ts` y los assets del splash/ícono.
# El backend (`resources/apps/backend`) lo copia `scripts/after-pack.mjs` — ver ese archivo.
afterPack: scripts/after-pack.mjs
extraResources:
  - from: ../../assets/branding/generated/windows
    to: assets/branding/generated/windows
  - from: ../../assets/branding/generated/splash
    to: assets/branding/generated/splash
icon: ../../assets/branding/generated/windows/icon.ico
# Auto-actualización (electron/main/auto-updater.ts): la app instalada lee `latest.yml` de los
# Releases de este repo. `pnpm --filter @stocknegozia/desktop release:win` (con GH_TOKEN) sube el
# instalador + `latest.yml` + `.blockmap` a un Release borrador; publicarlo lo habilita.
publish:
  provider: github
  owner: rodrireddev
  repo: StockNegozia
  releaseType: draft
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../../assets/branding/generated/windows/icon.ico
nsis:
  # Actualizar = correr el instalador nuevo sobre la versión instalada (mismo `appId`): reemplaza el
  # programa y deja intactos los datos del usuario, que viven fuera de la carpeta de instalación
  # (`%APPDATA%/@stocknegozia/desktop`: base, respaldos, credenciales). Al primer arranque el
  # backend respalda la base en `backups/pre-update/` y aplica las migraciones pendientes.
  # Por eso los datos NO se borran tampoco al desinstalar.
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
