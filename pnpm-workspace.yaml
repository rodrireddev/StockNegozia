packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - react-native-google-mobile-ads@17.1.0

# better-sqlite3 (usado solo por apps/backend, el backend legacy que no está en render.yaml)
# queda fuera de esta lista a propósito: Render corre un install de TODO el workspace antes de
# cualquier buildCommand (no respeta --filter), y en su imagen (Node 26 sobre glibc del build
# image) no hay binario prebuilt para better-sqlite3 y el compile nativo con node-gyp falla,
# tumbando el deploy de cloud-backend/admin-panel/landing aunque ninguno de los tres lo use.
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
